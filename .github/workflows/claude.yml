# Lets Claude answer `@claude` mentions in issues, PR comments and PR reviews.
# Based on anthropics/claude-code-action/examples/claude.yml.
#
# Setup (once):
#   1. Install the Claude GitHub App on this repo: https://github.com/apps/claude
#   2. Add the repository secret CLAUDE_CODE_OAUTH_TOKEN
#      (Settings > Secrets and variables > Actions > New repository secret).
#      Create the token with `claude setup-token`; usage counts against
#      your Claude subscription, so no separate API billing is needed.
#
# Usage: comment e.g. "@claude review this PR" on a pull request.
# Only users with write access to the repo can trigger it.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
